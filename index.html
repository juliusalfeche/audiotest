<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="A simple tool to check that the left and right channels of your headphones or speakers work and are not swapped.">

    <title>Left or Right? Headphone &amp; Speaker Test</title>

    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="intro">
            <img class="logo" src="assets/icons/logo-mark.svg" width="101" height="64" alt="">
            <h1>Left or Right?</h1>
            <p class="lead">Tap a side. You should hear a short tone in that ear only.</p>
        </header>

        <div class="controls" role="group" aria-label="Choose which side to test">
            <button type="button" id="test-left" data-pan="-1" data-label="left">
                <span class="glyph" aria-hidden="true">L</span>
                <span class="name">Left</span>
            </button>
            <button type="button" id="test-center" data-pan="0" data-label="both">
                <span class="glyph" aria-hidden="true">L+R</span>
                <span class="name">Both</span>
            </button>
            <button type="button" id="test-right" data-pan="1" data-label="right">
                <span class="glyph" aria-hidden="true">R</span>
                <span class="name">Right</span>
            </button>
        </div>

        <p class="hint">Start with a low volume.</p>
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>

    <footer class="site-footer">
        <a href="https://github.com/juliusalfeche/audiotest" target="_blank" rel="noopener noreferrer" aria-label="Audio Test on GitHub">
            <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">

            </svg>
        </a>
        <span>&copy; <span id="copyright-years">2025</span> Audio Test</span>
    </footer>
</body>
</html>
